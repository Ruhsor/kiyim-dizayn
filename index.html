<!DOCTYPE html>
<html lang="uz">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#7c3aed" />
    <meta name="description" content="Kiyim Dizayn — kiyim chizish va bezash uchun interaktiv PWA ilova." />
    <title>Kiyim Dizayn</title>
    <link rel="manifest" href="manifest.json" />
    <link rel="apple-touch-icon" href="icon.svg" />
    <style>
      :root {
        --bg: #f6f4ef;
        --card: #ffffff;
        --tx: #1f2937;
        --ac: #7c3aed;
        --bd: #d9d5dc;
        --soft: #f3ecff;
        --shadow: rgba(17, 24, 39, 0.18);
      }

      @media (prefers-color-scheme: dark) {
        :root:not([data-theme="light"]) {
          --bg: #17191d;
          --card: #23262d;
          --tx: #f3f4f6;
          --bd: #3a3f46;
          --soft: #2d243d;
        }
      }

      :root[data-theme="dark"] {
        --bg: #17191d;
        --card: #23262d;
        --tx: #f3f4f6;
        --bd: #3a3f46;
        --soft: #2d243d;
      }

      * { box-sizing: border-box; }
      html { scroll-behavior: smooth; }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--tx);
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        padding-top: env(safe-area-inset-top, 0px);
        padding-bottom: env(safe-area-inset-bottom, 0px);
      }

      header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 12px;
        padding: 10px 14px;
        font-weight: 700;
        background: rgba(255,255,255,0.02);
        border-bottom: 1px solid var(--bd);
      }

      .brand {
        display: flex;
        align-items: center;
        gap: 8px;
      }

      .badge {
        background: var(--ac);
        color: white;
        border-radius: 999px;
        font-size: 12px;
        line-height: 1;
        padding: 6px 10px;
        white-space: nowrap;
      }

      #wrap {
        flex: 1;
        display: flex;
        justify-content: center;
        align-items: center;
        padding: 8px;
        min-height: 0;
      }

      canvas {
        display: block;
        width: min(100%, 520px);
        height: auto;
        max-height: calc(100vh - 260px);
        background: #fff;
        border-radius: 16px;
        border: 1px solid var(--bd);
        box-shadow: 0 10px 28px var(--shadow);
        touch-action: none;
        aspect-ratio: 4 / 5;
      }

      .bar {
        display: flex;
        gap: 7px;
        overflow-x: auto;
        padding: 8px 10px;
        background: var(--card);
        border-top: 1px solid var(--bd);
        scrollbar-width: thin;
      }

      .bar button,
      .bar label {
        appearance: none;
        border: 1px solid var(--bd);
        background: var(--soft);
        color: var(--tx);
        border-radius: 10px;
        padding: 8px 12px;
        font: inherit;
        font-size: 13px;
        cursor: pointer;
        flex: 0 0 auto;
      }

      .bar button.on {
        background: var(--ac);
        border-color: var(--ac);
        color: white;
      }

      .sw {
        width: 34px;
        height: 34px;
        border-radius: 50%;
        border: 2px solid var(--bd);
        padding: 0 !important;
        min-width: 34px;
      }

      input[type="color"] {
        width: 38px;
        height: 34px;
        border: 0;
        padding: 0;
        background: none;
        border-radius: 8px;
        cursor: pointer;
      }

      input[type="range"] {
        width: 110px;
        accent-color: var(--ac);
      }

      #modal {
        position: fixed;
        inset: 0;
        display: none;
        align-items: center;
        justify-content: center;
        background: rgba(0,0,0,0.6);
        z-index: 30;
        padding: 20px;
      }

      #modal > div {
        background: var(--card);
        border-radius: 18px;
        border: 1px solid var(--bd);
        box-shadow: 0 12px 34px rgba(0,0,0,0.2);
        max-width: 360px;
        width: 100%;
        padding: 18px 20px;
        text-align: center;
      }

      #modal h3 {
        margin-top: 0;
        margin-bottom: 12px;
      }

      #modal p {
        color: var(--tx);
        margin: 0 0 16px;
        line-height: 1.6;
      }

      #modal .actions {
        display: flex;
        justify-content: center;
        gap: 10px;
        flex-wrap: wrap;
      }

      #modal button {
        border: 0;
        border-radius: 10px;
        padding: 10px 16px;
        font: inherit;
        cursor: pointer;
        background: var(--ac);
        color: white;
      }

      #modal button.secondary {
        background: #888;
      }
    </style>
  </head>
  <body>
    <header>
      <div class="brand">👗 <span>Kiyim Dizayn</span></div>
      <span class="badge" id="status">Yuklanmoqda...</span>
    </header>

    <div id="wrap">
      <canvas id="cv" width="800" height="1000"></canvas>
    </div>

    <div class="bar" id="tools"></div>
    <div class="bar" id="templates"></div>
    <div class="bar" id="colors"></div>
    <div class="bar" id="patterns"></div>

    <div id="modal">
      <div>
        <h3>⭐ Plus kerak</h3>
        <p>Bepul davr tugadi. Plus bilan: odam figuralariga mos ko'ylaklar va noyob bezaklar ochiladi.</p>
        <div class="actions">
          <button id="buy">Plus olish</button>
          <button id="close" class="secondary">Yopish</button>
        </div>
      </div>
    </div>

    <script>
      const cv = document.getElementById('cv');
      const ctx = cv.getContext('2d', { willReadFrequently: true });
      const W = 800;
      const H = 1000;

      let tool = 'pen';
      let color = '#e11d48';
      let size = 5;
      let pattern = null;
      let undo = [];
      let redo = [];
      let drawing = false;
      let last = null;

      function $(id) { return document.getElementById(id); }
      function barBtn(parentId, text, onClick, extraClass) {
        const btn = document.createElement('button');
        btn.textContent = text;
        btn.onclick = () => onClick(btn);
        if (extraClass) btn.className = extraClass;
        $(parentId).appendChild(btn);
        return btn;
      }

      function markActive(parentId, activeBtn) {
        const parent = $(parentId);
        Array.from(parent.children).forEach((el) => el.classList.remove('on'));
        if (activeBtn) activeBtn.classList.add('on');
      }

      function snap() {
        undo.push(ctx.getImageData(0, 0, W, H));
        if (undo.length > 25) undo.shift();
        redo = [];
      }

      function blank() {
        ctx.fillStyle = '#fff';
        ctx.fillRect(0, 0, W, H);
      }

      function pos(event) {
        const rect = cv.getBoundingClientRect();
        return {
          x: ((event.clientX - rect.left) / rect.width) * W,
          y: ((event.clientY - rect.top) / rect.height) * H,
        };
      }

      function stroke(from, to) {
        ctx.strokeStyle = tool === 'erase' ? '#fff' : color;
        ctx.lineWidth = tool === 'erase' ? size * 2.4 : size;
        ctx.lineCap = 'round';
        ctx.lineJoin = 'round';
        ctx.beginPath();
        ctx.moveTo(from.x, from.y);
        ctx.lineTo(to.x, to.y);
        ctx.stroke();
      }

      function fillImage(x, y) {
        if (x < 0 || y < 0 || x >= W || y >= H) return;

        const img = ctx.getImageData(0, 0, W, H);
        const data = img.data;
        const targetIndex = (y * W + x) * 4;
        const targetR = data[targetIndex];
        const targetG = data[targetIndex + 1];
        const targetB = data[targetIndex + 2];

        const sameColor = (r, g, b) => Math.abs(r - targetR) + Math.abs(g - targetG) + Math.abs(b - targetB) <= 90;
        const queue = [y * W + x];
        const seen = new Uint8Array(W * H);
        seen[y * W + x] = 1;

        const hex = color;
        const rr = parseInt(hex.slice(1, 3), 16);
        const rg = parseInt(hex.slice(3, 5), 16);
        const rb = parseInt(hex.slice(5, 7), 16);

        while (queue.length) {
          const idx = queue.pop();
          const px = idx % W;
          const py = Math.floor(idx / W);

          const i = idx * 4;
          if (sameColor(data[i], data[i + 1], data[i + 2])) {
            data[i] = rr;
            data[i + 1] = rg;
            data[i + 2] = rb;
            data[i + 3] = 255;
          }

          const neighbors = [];
          if (px > 0) neighbors.push(idx - 1);
          if (px < W - 1) neighbors.push(idx + 1);
          if (py > 0) neighbors.push(idx - W);
          if (py < H - 1) neighbors.push(idx + W);

          for (const n of neighbors) {
            if (seen[n]) continue;
            const ni = n * 4;
            if (sameColor(data[ni], data[ni + 1], data[ni + 2])) {
              seen[n] = 1;
              queue.push(n);
            }
          }
        }

        ctx.putImageData(img, 0, 0);
      }

      const TRIAL_DAYS = 30;
      let start = Date.now();
      let plusBought = false;

      try {
        const savedStart = localStorage.getItem('dz_start');
        if (savedStart) start = Number(savedStart);
        else localStorage.setItem('dz_start', String(start));
        plusBought = localStorage.getItem('dz_plus') === '1';
      } catch (e) {}

      const daysLeft = Math.max(0, TRIAL_DAYS - Math.floor((Date.now() - start) / 86400000));
      const isPlus = () => plusBought || daysLeft > 0;
      const statusEl = $('status');
      statusEl.textContent = plusBought ? 'Plus ✓' : daysLeft > 0 ? `Hammasi bepul: ${daysLeft} kun` : 'Bepul reja';

      const modal = $('modal');
      const needPlus = () => {
        if (isPlus()) return false;
        modal.style.display = 'flex';
        return true;
      };
      $('close').onclick = () => modal.style.display = 'none';
      $('buy').onclick = () => {
        try { localStorage.setItem('dz_plus', '1'); } catch (e) {}
        plusBought = true;
        modal.style.display = 'none';
        statusEl.textContent = 'Plus ✓';
      };

      function outline(fn) {
        ctx.strokeStyle = '#1f2937';
        ctx.lineWidth = 4;
        ctx.beginPath();
        fn();
        ctx.stroke();
      }

      const templateSets = {
        futbolka() {
          outline(() => {
            ctx.moveTo(250, 200);
            ctx.lineTo(340, 170);
            ctx.quadraticCurveTo(400, 240, 460, 170);
            ctx.lineTo(550, 200);
            ctx.lineTo(680, 330);
            ctx.lineTo(600, 400);
            ctx.lineTo(540, 350);
            ctx.lineTo(540, 820);
            ctx.lineTo(260, 820);
            ctx.lineTo(260, 350);
            ctx.lineTo(200, 400);
            ctx.lineTo(120, 330);
            ctx.closePath();
          });
        },

        koylak() {
          outline(() => {
            ctx.moveTo(330, 150);
            ctx.lineTo(360, 150);
            ctx.quadraticCurveTo(400, 230, 440, 150);
            ctx.lineTo(470, 150);
            ctx.lineTo(500, 400);
            ctx.lineTo(580, 850);
            ctx.quadraticCurveTo(400, 910, 220, 850);
            ctx.lineTo(300, 400);
            ctx.closePath();
            ctx.moveTo(300, 400);
            ctx.lineTo(500, 400);
          });
        },

        shim() {
          outline(() => {
            ctx.moveTo(270, 150);
            ctx.lineTo(530, 150);
            ctx.lineTo(560, 850);
            ctx.lineTo(430, 850);
            ctx.lineTo(400, 400);
            ctx.lineTo(370, 850);
            ctx.lineTo(240, 850);
            ctx.closePath();
            ctx.moveTo(272, 230);
            ctx.lineTo(528, 230);
          });
        },
      };

      function figureShape(w, hip) {
        outline(() => {
          ctx.arc(400, 100, 42, 0, Math.PI * 2);
          ctx.moveTo(385, 142);
          ctx.lineTo(385, 175);
          ctx.moveTo(415, 142);
          ctx.lineTo(415, 175);

          ctx.moveTo(400 - w, 180);
          ctx.lineTo(400 - w - 40, 400);

          ctx.moveTo(400 + w, 180);
          ctx.lineTo(400 + w + 40, 400);

          ctx.moveTo(400 - hip * 0.5, 700);
          ctx.lineTo(400 - hip * 0.4, 950);
          ctx.lineTo(400 - hip * 0.1, 950);
          ctx.lineTo(400, 720);
          ctx.lineTo(400 + hip * 0.1, 950);
          ctx.lineTo(400 + hip * 0.4, 950);
          ctx.lineTo(400 + hip * 0.5, 700);

          ctx.moveTo(400 - w, 180);
          ctx.lineTo(400 + w, 180);
          ctx.lineTo(400 + w * 0.7, 330);
          ctx.lineTo(400 + hip * 0.55, 720);
          ctx.lineTo(400 - hip * 0.55, 720);
          ctx.lineTo(400 - w * 0.7, 330);
          ctx.closePath();
          ctx.moveTo(400 - w * 0.7, 330);
          ctx.lineTo(400 + w * 0.7, 330);
        });
      }

      const figureTemplates = {
        'Ingichka': () => figureShape(70, 150),
        'O\'rta': () => figureShape(85, 200),
        'Katta': () => figureShape(105, 260),
      };

      function loadTemplate(callback, requirePlus = false) {
        if (requirePlus && needPlus()) return;
        snap();
        blank();
        callback();
      }

      Object.entries(templateSets).forEach(([key, fn]) => {
        const label = key === 'futbolka' ? '👕 Futbolka' : key === 'koylak' ? '👗 Ko\'ylak' : '👖 Shim';
        barBtn('templates', label, () => loadTemplate(fn));
      });

      Object.entries(figureTemplates).forEach(([key, fn]) => {
        barBtn('templates', '🔒 ' + key + ' figura', () => loadTemplate(fn, true));
      });

      blank();
      templateSets.futbolka();

      const patterns = {
        'Oddiy rang': null,
        'Nuqta': (colorHex) => createPattern((ctx2) => {
          ctx2.fillStyle = '#fff';
          ctx2.fillRect(0, 0, 48, 48);
          ctx2.fillStyle = colorHex;
          ctx2.beginPath();
          ctx2.arc(24, 24, 8, 0, Math.PI * 2);
          ctx2.fill();
        }),
        'Chiziq': (colorHex) => createPattern((ctx2) => {
          ctx2.fillStyle = '#fff';
          ctx2.fillRect(0, 0, 48, 48);
          ctx2.fillStyle = colorHex;
          ctx2.fillRect(0, 0, 48, 16);
        }),
        'Katak': (colorHex) => createPattern((ctx2) => {
          ctx2.fillStyle = '#fff';
          ctx2.fillRect(0, 0, 48, 48);
          ctx2.fillStyle = colorHex;
          ctx2.fillRect(0, 0, 24, 24);
          ctx2.fillRect(24, 24, 24, 24);
        }),
        'Gul': (colorHex) => createPattern((ctx2) => {
          ctx2.fillStyle = '#fff';
          ctx2.fillRect(0, 0, 48, 48);
          ctx2.fillStyle = colorHex;
          for (let i = 0; i < 6; i++) {
            const a = i * (Math.PI / 3);
            ctx2.beginPath();
            ctx2.arc(24 + 11 * Math.cos(a), 24 + 11 * Math.sin(a), 7, 0, Math.PI * 2);
            ctx2.fill();
          }
          ctx2.fillStyle = '#facc15';
          ctx2.beginPath();
          ctx2.arc(24, 24, 6, 0, Math.PI * 2);
          ctx2.fill();
        }),
        'Atlas': (colorHex) => createPattern((ctx2) => {
          const colors = ['#dc2626', '#2563eb', '#16a34a', '#f59e0b', '#7c3aed'];
          for (let i = 0; i < 5; i++) {
            ctx2.fillStyle = colors[i];
            ctx2.beginPath();
            ctx2.moveTo(0, i * 10);
            ctx2.lineTo(24, i * 10 - 8);
            ctx2.lineTo(48, i * 10);
            ctx2.lineTo(48, i * 10 + 10);
            ctx2.lineTo(24, i * 10 + 2);
            ctx2.lineTo(0, i * 10 + 10);
            ctx2.fill();
          }
        }),
        'Ikat': (colorHex) => createPattern((ctx2) => {
          ctx2.fillStyle = '#1e3a8a';
          ctx2.fillRect(0, 0, 48, 48);
          ctx2.fillStyle = '#fff';
          ctx2.beginPath();
          ctx2.moveTo(24, 4);
          ctx2.lineTo(44, 24);
          ctx2.lineTo(24, 44);
          ctx2.lineTo(4, 24);
          ctx2.fill();
          ctx2.fillStyle = colorHex;
          ctx2.beginPath();
          ctx2.moveTo(24, 14);
          ctx2.lineTo(34, 24);
          ctx2.lineTo(24, 34);
          ctx2.lineTo(14, 24);
          ctx2.fill();
        }),
      };

      function createPattern(draw) {
        const d = document.createElement('canvas');
        d.width = 48;
        d.height = 48;
        const p = d.getContext('2d');
        draw(p);
        return p.getImageData(0, 0, 48, 48);
      }

      const patternButtons = [];
      Object.keys(patterns).forEach((key) => {
        const btn = barBtn('patterns', key === 'Oddiy rang' ? 'Oddiy rang' : '🔒 ' + key, (button) => {
          if (key === 'Oddiy rang') {
            pattern = null;
          } else {
            if (needPlus()) return;
            pattern = patterns[key](color);
          }
          markActive('patterns', button);
        });
        patternButtons.push(btn);
      });

      patternButtons[0].classList.add('on');

      [
        ['✏️ Qalam', 'pen'],
        ['🪣 Bo\'yash', 'fill'],
        ['🧽 O\'chirgich', 'erase'],
      ].forEach(([label, value], index) => {
        const btn = barBtn('tools', label, (button) => {
          tool = value;
          markActive('tools', button);
        }, index === 0 ? 'on' : '');
        if (index === 0) tool = value;
      });

      const range = document.createElement('input');
      range.type = 'range';
      range.min = 2;
      range.max = 30;
      range.value = String(size);
      range.oninput = () => { size = Number(range.value); };
      $('tools').appendChild(range);

      barBtn('tools', '↩️', () => {
        if (!undo.length) return;
        redo.push(ctx.getImageData(0, 0, W, H));
        ctx.putImageData(undo.pop(), 0, 0);
      });

      barBtn('tools', '↪️', () => {
        if (!redo.length) return;
        undo.push(ctx.getImageData(0, 0, W, H));
        ctx.putImageData(redo.pop(), 0, 0);
      });

      barBtn('tools', '🗑️', () => {
        snap();
        blank();
      });

      barBtn('tools', '💾', () => {
        const link = document.createElement('a');
        link.download = 'dizayn.png';
        link.href = cv.toDataURL('image/png');
        link.click();
      });

      const colorList = ['#e11d48', '#f97316', '#facc15', '#22c55e', '#06b6d4', '#2563eb', '#7c3aed', '#ec4899', '#92400e', '#111827', '#9ca3af', '#ffffff', '#fde2c8', '#f5c6a0'];
      colorList.forEach((c) => {
        const sw = barBtn('colors', '', () => {
          color = c;
          colorInput.value = c;
        }, 'sw');
        sw.style.background = c;
      });

      const colorInput = document.createElement('input');
      colorInput.type = 'color';
      colorInput.value = color;
      colorInput.oninput = () => { color = colorInput.value; };
      $('colors').appendChild(colorInput);

      cv.addEventListener('pointerdown', (event) => {
        event.preventDefault();
        const p = pos(event);
        if (tool === 'fill') {
          fillImage(Math.round(p.x), Math.round(p.y));
          return;
        }
        snap();
        drawing = true;
        last = p;
        cv.setPointerCapture(event.pointerId);
        stroke(p, p);
      });

      cv.addEventListener('pointermove', (event) => {
        if (!drawing) return;
        const p = pos(event);
        stroke(last, p);
        last = p;
      });

      ['pointerup', 'pointercancel', 'pointerleave'].forEach((eventName) => {
        cv.addEventListener(eventName, () => {
          drawing = false;
        });
      });

      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('sw.js').catch(() => {});
        });
      }
    </script>
  </body>
</html>
